<script>
let m = window.location.pathname.match(/^\/cve\/(cve-\d+-\d+)/i);
if (m) {
  let cve = m[1];
  window.location.replace('https://github.com/originlab/cve/security/advisories?state=published&query=' + cve);
} else {
  window.location.replace('https://github.com/originlab/cve/security');
}
</script>
